name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-and-build:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: karma
          POSTGRES_PASSWORD: localdev-only
          POSTGRES_DB: karmas_world
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @karmas-world/api db:generate

      - name: Build Shared Package
        run: pnpm shared:build

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql://karma:localdev-only@localhost:5432/karmas_world?schema=public
        run: pnpm --filter @karmas-world/api db:deploy

      - name: Typecheck Frontend
        run: pnpm build

      - name: Typecheck & Build Backend
        run: pnpm api:build

      - name: Run Frontend & E2E Security Tests
        run: pnpm test

      - name: Run Backend & Security Audit Tests
        env:
          NODE_ENV: test
          PORT: 4000
          WEB_ORIGIN: http://localhost:5173
          DATABASE_URL: postgresql://karma:localdev-only@localhost:5432/karmas_world?schema=public
          SESSION_SECRET: test-session-secret-at-least-32-chars-long-abc123
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_SECURE: false
          SMTP_FROM: no-reply@karmas.world
        run: pnpm api:test

  docker-build:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    needs: lint-test-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: karmas-world-frontend:latest

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: karmas-world-api:latest
